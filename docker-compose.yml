version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: locomotive-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-locomotive_dt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-locomotive_dt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: locomotive-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: ${BACKEND_PORT:-8000}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/locomotive_dt
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    container_name: locomotive-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
      VITE_WS_URL: ws://localhost:${BACKEND_PORT:-8000}/ws/telemetry/live
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  postgres_data:
