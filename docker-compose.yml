version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: locomotive-backend
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: ${BACKEND_PORT:-8000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    container_name: locomotive-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}/api
      VITE_WS_URL: ws://localhost:${BACKEND_PORT:-8000}/ws/telemetry
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
